# Auto-deploy static site to VPS when main changes.
# Required GitHub secrets:
#   DEPLOY_HOST   — e.g. 193.29.224.1
#   DEPLOY_USER   — e.g. root
#   DEPLOY_SSH_KEY — private SSH key with access to the host
# Optional:
#   DEPLOY_DIR    — default /var/www/djannasobol
#   DEPLOY_PORT   — default 22

name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          test -n "$DEPLOY_SSH_KEY" || { echo "Missing secret DEPLOY_SSH_KEY"; exit 1; }
          test -n "$DEPLOY_HOST" || { echo "Missing secret DEPLOY_HOST"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload site files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          USER="${DEPLOY_USER:-root}"
          DIR="${DEPLOY_DIR:-/var/www/djannasobol}"
          PORT="${DEPLOY_PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${USER}@${DEPLOY_HOST}" "mkdir -p '${DIR}/assets'"
          scp -i ~/.ssh/deploy_key -P "$PORT" -o StrictHostKeyChecking=accept-new \
            index.html "${USER}@${DEPLOY_HOST}:${DIR}/index.html"
          if [ -d assets ]; then
            scp -i ~/.ssh/deploy_key -P "$PORT" -o StrictHostKeyChecking=accept-new \
              assets/* "${USER}@${DEPLOY_HOST}:${DIR}/assets/"
          fi
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${USER}@${DEPLOY_HOST}" "chown -R www-data:www-data '${DIR}' 2>/dev/null || true; find '${DIR}' -type f -exec chmod 644 {} +"

      - name: Smoke check
        run: |
          sleep 2
          curl -fsSIL --max-time 20 https://djannasobol.com/ | head -n 15
          curl -fsSIL --max-time 20 https://djannasobol.com/assets/hero-bali-desktop.mp4 | head -n 12
          curl -fsS --max-time 20 https://djannasobol.com/ | head -n 12
